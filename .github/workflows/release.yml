---
# yamllint disable rule:line-length
# Shell scripts embedded in workflow run: blocks routinely exceed 80 chars.
# Line-length is suppressed for this file only; all other rules still apply.

# Release workflow for the newrelic-install Chef cookbook.
#
# Trigger: manually via Actions → Release → Run workflow.
#
# Two modes, selected by the skip_version_bump boolean:
#
#   skip_version_bump = false  (default — full automated release)
#     1. Validate version format and that it increments the current patch.
#     2. Assert RELEASE_TOKEN is configured (required for the direct push).
#     3. Bump metadata.rb, commit as github-actions[bot], push directly to main.
#     4. Publish to Chef Supermarket; poll API until the version is live.
#
#   skip_version_bump = true  (publish-only — version already on main)
#     1. Validate format; assert metadata.rb already contains exactly the
#        requested version — hard-fail with a mismatch error if not.
#     2. Skip bump and commit entirely.
#     3. Publish to Chef Supermarket; poll API until the version is live.
#
# Direct push to main (bump mode) requires RELEASE_TOKEN — a PAT owned by
# nr-developer-toolkit, which has admin access and therefore bypass privilege
# on the org-level Branch Protection ruleset. This is the same mechanism used
# by the open-install-library release workflow. Without it the push is rejected
# by GitHub with error GH013.
name: Release

# contents: write — required to push the version-bump commit directly to main.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — must follow 0.1.x convention'
        required: true
        type: string
      skip_version_bump:
        description: 'Skip metadata.rb bump — use when the version is already on main'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: "🚀 Release: Publish newrelic-install to Chef Supermarket"
    # Chef Workstation install (~1 min) + optional commit + knife + 2-min Supermarket poll.
    timeout-minutes: 15
    steps:
      # Shallow clone of main is sufficient — we only read and write one file.
      # RELEASE_TOKEN authenticates the subsequent push as nr-developer-toolkit
      # (admin, bypass privilege on the org ruleset). Falls back to GITHUB_TOKEN
      # for publish-only mode where no push to main occurs.
      - name: "📦 Checkout: Fetch main at HEAD"
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Bump mode only: asserts RELEASE_TOKEN is present before making any changes.
      # Gives an actionable error immediately rather than failing at push time with
      # a generic GH013 after metadata.rb has already been modified on disk.
      - name: "🔐 Pre-flight: Verify RELEASE_TOKEN is Configured"
        if: github.event.inputs.skip_version_bump != 'true'
        env:
          RELEASE_TOKEN_SET: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TOKEN_SET" != "true" ]; then
            echo "::error::❌ RELEASE_TOKEN is not configured for this repository."
            echo "::error::   Bump mode requires a PAT owned by a repo admin (nr-developer-toolkit)."
            echo "::error::   Add it at: https://github.com/newrelic/chef-install/settings/secrets/actions"
            echo "::error::   Alternatively, merge the version bump manually and re-run with skip_version_bump=true."
            exit 1
          fi
          echo "✅ RELEASE_TOKEN is present — push will authenticate as nr-developer-toolkit."

      # Bump mode: validates input is strictly greater than the current patch version.
      # Publish-only mode: validates that metadata.rb already contains exactly the
      # requested version — rejects with a mismatch error if not.
      # Format guard (0.1.x convention) applies in both modes.
      - name: "🔍 Validate: Verify Version Against Mode and metadata.rb"
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          SKIP_BUMP="${{ github.event.inputs.skip_version_bump }}"

          CURRENT=$(grep -E "^version '" metadata.rb | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          CURRENT_PATCH=$(echo "$CURRENT" | cut -d. -f3)

          # Format guard — applies in both modes.
          if ! echo "$VERSION" | grep -qE '^0\.1\.[0-9]+$'; then
            echo "::error::❌ Invalid version '$VERSION'."
            echo "::error::   Must follow the 0.1.x convention (x = non-negative integer)."
            echo "::error::   Current version in metadata.rb: $CURRENT"
            echo "::error::   Next suggested version:         0.1.$((CURRENT_PATCH + 1))"
            exit 1
          fi

          if [ "$SKIP_BUMP" = "true" ]; then
            # Publish-only: metadata.rb must already be at exactly this version.
            if [ "$VERSION" != "$CURRENT" ]; then
              echo "::error::❌ Version mismatch — requested '$VERSION' but metadata.rb is at '$CURRENT'."
              echo "::error::   Merge a version bump PR to main first, then re-run with skip_version_bump=true."
              echo "::error::   Or re-run with skip_version_bump=false to let the workflow bump it automatically."
              exit 1
            fi
            echo "✅ Publish-only mode: metadata.rb confirmed at '$VERSION' — proceeding to publish."
          else
            # Bump mode: input must strictly increment the current patch.
            INPUT_PATCH=$(echo "$VERSION" | cut -d. -f3)
            if [ "$INPUT_PATCH" -le "$CURRENT_PATCH" ]; then
              echo "::error::❌ '$VERSION' does not increment the current version '$CURRENT'."
              echo "::error::   Patch number must exceed $CURRENT_PATCH."
              echo "::error::   Next suggested version: 0.1.$((CURRENT_PATCH + 1))"
              exit 1
            fi
            echo "✅ Bump mode: '$VERSION' is valid — releasing $CURRENT → $VERSION."
          fi

      # Rewrites the version line in metadata.rb and reads it back to confirm.
      # The read-back assertion catches silent no-ops if the line format ever drifts.
      # Skipped when skip_version_bump=true.
      - name: "✏️ Bump: Update Version in metadata.rb"
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          set -euo pipefail
          sed -i "s/^version '.*'/version '${{ github.event.inputs.version }}'/" metadata.rb

          WRITTEN=$(grep -E "^version '" metadata.rb | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ "$WRITTEN" != "${{ github.event.inputs.version }}" ]; then
            echo "::error::❌ Write verification failed — metadata.rb shows '$WRITTEN', expected '${{ github.event.inputs.version }}'."
            exit 1
          fi
          echo "✅ metadata.rb updated to '$WRITTEN'."

      # Commits as github-actions[bot] and pushes directly to main via RELEASE_TOKEN.
      # Authentication is as nr-developer-toolkit (admin bypass); authorship is set
      # separately via git config and shows as github-actions[bot] in the commit log.
      # Release date is stamped in IST. [skip ci] prevents CI re-running on this commit.
      # Skipped when skip_version_bump=true.
      - name: "📝 Commit: Push Version Bump to main"
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          set -euo pipefail
          RELEASE_DATE=$(TZ="Asia/Kolkata" date +'%-d %B %Y')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata.rb
          git commit -m "chore(version): bump to ${{ github.event.inputs.version }}, ${RELEASE_DATE} [skip ci]"

          # Retry once with rebase if another commit landed on main between checkout and push.
          if ! git push origin main; then
            echo "Push rejected — rebasing on latest main and retrying..."
            git pull --rebase origin main
            git push origin main
          fi
          echo "✅ Version bump committed and pushed."

      # Installs Chef Workstation, providing the knife CLI used to publish to Supermarket.
      - name: "🔧 Setup: Install Chef Workstation"
        uses: actionshub/chef-install@2.0.4

      # Writes the Supermarket RSA private key from secrets to disk.
      # Uses env: so the secret value is not interpolated directly into the script.
      # knife resolves this path via .chef/config.rb (client_key '../newrelic.pem').
      - name: "🔑 Auth: Write Chef Supermarket PEM Credential"
        env:
          NEWRELIC_PEM: ${{ secrets.NEWRELIC_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$NEWRELIC_PEM" ]; then
            echo "::error::❌ NEWRELIC_PEM secret is not configured."
            exit 1
          fi
          echo "$NEWRELIC_PEM" > newrelic.pem

      # Packages the cookbook and uploads it to Chef Supermarket under the newrelic account.
      # knife reads version and credentials from local files — metadata.rb is always
      # at the correct version by the time this step runs.
      - name: "📤 Publish: Share newrelic-install to Chef Supermarket"
        run: knife supermarket share newrelic-install

      # Removes the PEM from disk unconditionally — runs even if publish fails.
      # rm -f will not error if the file does not exist.
      - name: "🧹 Cleanup: Remove PEM Credential from Disk"
        if: always()
        run: rm -f newrelic.pem

      # Polls the public Supermarket REST API until the new version is confirmed live.
      # Both dot (0.1.x) and underscore (0_1_x) formats are accepted by the API;
      # dots are used here for consistency with the version string throughout this file.
      # A polling timeout exits with ::warning:: rather than failure — the publish step
      # already returned success; propagation lag is not a release failure.
      - name: "🔎 Verify: Confirm Version is Live on Chef Supermarket"
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          URL="https://supermarket.chef.io/api/v1/cookbooks/newrelic-install/versions/${VERSION}"
          MAX_ATTEMPTS=12
          ATTEMPT=0

          echo "Polling Chef Supermarket for version '$VERSION'..."
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Version '$VERSION' is live: https://supermarket.chef.io/cookbooks/newrelic-install/versions/${VERSION}"
              exit 0
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — HTTP $STATUS, not yet visible. Retrying in 10s..."
            sleep 10
          done

          echo "::warning::⚠️ Version '$VERSION' not confirmed on Supermarket after $((MAX_ATTEMPTS * 10))s."
          echo "::warning::   Publish step succeeded — propagation may still be in progress."
          echo "::warning::   Check manually: https://supermarket.chef.io/cookbooks/newrelic-install"
